services:
  - type: web
    name: easycar-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash render_start.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: easycar.settings
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_SQLITE
        value: "True"
      - key: SQLITE_PATH
        value: /tmp/easycar.sqlite3
    healthCheckPath: /api/health/
    autoDeploy: true
